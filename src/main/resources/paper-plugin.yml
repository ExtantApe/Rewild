name: Rewild
version: '${version}'
main: com.extantape.rewild.RewildPlugin
api-version: '26.1'
description: Quietly resets abandoned, damaged chunks so survival worlds stay wild, and keeps anything that looks intentional.
website: https://github.com/ExtantApe/Rewild
dependencies:
  server:
    # Load after these so their data is there when a scan or the shutdown check reads it. None is required.
    GriefPrevention:
      load: BEFORE
      required: false
    Multiverse-Core:
      load: BEFORE
      required: false
    Multiverse-Portals:
      load: BEFORE
      required: false
    LanternGraves:
      load: BEFORE
      required: false
    CoreProtect:
      load: BEFORE
      required: false
    BlueMap:
      load: BEFORE
      required: false
      # The map layer uses BlueMap's API classes directly.
      join-classpath: true
permissions:
  rewild.admin:
    description: Use /rewild. Players get no commands.
    default: op
  wildernessregen.admin:
    description: The old name for rewild.admin, from before the rename. Still works in 0.2.x and is removed in the next release.
    default: false
