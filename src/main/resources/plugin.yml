name: WildernessRegen
version: '${version}'
main: com.extantape.wildernessregen.WildernessRegenPlugin
api-version: '1.21.11'
description: Quietly resets abandoned, damaged chunks so survival worlds stay wild, and keeps anything that looks intentional.
website: https://github.com/ExtantApe/WildernessRegen
softdepend: [GriefPrevention, BlueMap, Multiverse-Core, Multiverse-Portals, LanternGraves, CoreProtect]
commands:
  wr:
    description: WildernessRegen admin tools.
    usage: /wr status | why | preview | scan | approve | undo | protect | reload
    aliases: [wildernessregen]
    permission: wildernessregen.admin
permissions:
  wildernessregen.admin:
    description: Use /wr. Players get no commands.
    default: op
