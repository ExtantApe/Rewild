name: Rewild
version: '${version}'
main: com.extantape.rewild.RewildPlugin
api-version: '26.1'
description: Rewilds abandoned, mined-out land on Paper servers back to fresh terrain, keeping every player-placed block, path and protected place exactly where it is.
website: https://github.com/ExtantApe/Rewild
dependencies:
  server:
    # Load after these so their data is there when a scan or the shutdown check reads it. None is required.
    GriefPrevention:
      load: BEFORE
      required: false
    Multiverse-Core:
      load: BEFORE
      required: false
    Multiverse-Portals:
      load: BEFORE
      required: false
    LanternGraves:
      load: BEFORE
      required: false
    CoreProtect:
      load: BEFORE
      required: false
    BlueMap:
      load: BEFORE
      required: false
      # The map layer uses BlueMap's API classes directly.
      join-classpath: true
permissions:
  rewild.admin:
    description: Use /rewild. Players get no commands.
    default: op
